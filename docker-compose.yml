services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  nodejs-app:
    build: .
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    environment:
      - DB_CONNECTION=mongodb://mongodb:27017/mymongodbdatabase

volumes:
  mongo-data:
